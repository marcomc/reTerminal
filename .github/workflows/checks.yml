name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation tools
        run: |
          python -m pip install ruff
          npm install -g markdownlint-cli
      - name: Helper regressions
        run: python -m unittest discover -s templates/google-calendar-today/tests
      - name: Source semantics
        run: node templates/google-calendar-today/scripts/check.js
      - name: Configurator browser models
        run: node templates/google-calendar-today/tests/check_frontend.js
      - name: Python lint
        run: |
          ruff check templates/google-calendar-today/configurator templates/google-calendar-today/scripts templates/google-calendar-today/tests
          ruff format --check templates/google-calendar-today/configurator templates/google-calendar-today/scripts templates/google-calendar-today/tests
      - name: Markdown lint
        run: markdownlint --disable MD013 --config .markdownlint.json '**/*.md'
      - name: Whitespace
        run: git diff --check
